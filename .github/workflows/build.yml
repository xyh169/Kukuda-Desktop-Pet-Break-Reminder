name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./测试.command
      - name: Build Universal 2 app
        run: KIWI_BREAK_NO_OPEN=1 ./构建并运行.command
      - name: Package
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kukuda-macOS-universal
          path: dist/Kukuda-v*-macOS-universal.zip

